<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas Acadêmicas</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
    </header>

    <main>

        <p data-estado role="status" aria-live="polite"></p>

        <section aria-labelledby="titulo-filtros">
            <h2 id="titulo-filtros">Buscar e filtrar tarefas</h2>

            <form>
                <div>
                    <label for="busca">Buscar tarefa</label>
                    <input
                        type="text"
                        id="busca"
                        name="busca"
                        placeholder="Digite o título da tarefa"
                    >
                </div>

                <fieldset>
                    <legend>Filtrar por status</legend>

                    <div>
                        <input
                            type="radio"
                            id="status-afazer-filtro"
                            name="status"
                            value="a_fazer"
                        >
                        <label for="status-afazer-filtro">A fazer</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="status-andamento-filtro"
                            name="status"
                            value="em_andamento"
                        >
                        <label for="status-andamento-filtro">Em andamento</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="status-revisao-filtro"
                            name="status"
                            value="em_revisao"
                        >
                        <label for="status-revisao-filtro">Em revisão</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="status-concluida-filtro"
                            name="status"
                            value="concluida"
                        >
                        <label for="status-concluida-filtro">Concluída</label>
                    </div>
                </fieldset>

                <button type="submit">Buscar</button>
            </form>
        </section>

        <section aria-labelledby="titulo-tarefas">
            <h2 id="titulo-tarefas">Minhas tarefas</h2>

            <div class="quadro-tarefas">

                <section aria-labelledby="status-afazer">
                    <h3 id="status-afazer">A fazer</h3>
                    <ul></ul>
                </section>

                <section aria-labelledby="status-andamento">
                    <h3 id="status-andamento">Em andamento</h3>
                    <ul></ul>
                </section>

                <section aria-labelledby="status-revisao">
                    <h3 id="status-revisao">Em revisão</h3>
                    <ul></ul>
                </section>

                <section aria-labelledby="status-concluida">
                    <h3 id="status-concluida">Concluída</h3>
                    <ul></ul>
                </section>

            </div>
        </section>

    </main>

    <footer>
        <p>Desenvolvimento Frontend — 2026.2</p>
        <p>Artur Murada</p>
    </footer>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
